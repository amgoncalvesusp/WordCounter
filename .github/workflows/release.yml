name: Build and release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR
        shell: powershell
        run: |
          choco install tesseract -y
          $source = "C:\Program Files\Tesseract-OCR"
          $bundle = "$env:RUNNER_TEMP\tesseract-bundle"
          Copy-Item -LiteralPath $source -Destination $bundle -Recurse
          $tessData = "$bundle\tessdata"
          New-Item -ItemType Directory -Force -Path $tessData
          Invoke-WebRequest `
            -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/por.traineddata" `
            -OutFile "$tessData\por.traineddata"
          "TESSERACT_BUNDLE_DIR=$bundle" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run tests
        shell: cmd
        run: |
          py -3.11 -m pip install -r requirements-dev.txt -c requirements-build.txt
          py -3.11 -m pytest --cov --cov-report=term --cov-fail-under=80

      - name: Build executable
        shell: powershell
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and $_ -notmatch 'Tesseract-OCR'
          }) -join ';'
          cmd /c build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare release assets and checksum
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $asset = "dist\ContadorPalavras-$env:RELEASE_TAG.exe"
          Copy-Item `
            -LiteralPath "dist\ContadorPalavras.exe" `
            -Destination "$asset"
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $asset)" | Set-Content `
            -LiteralPath "$asset.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContadorPalavras-${{ github.ref_name }}
          path: |
            dist/ContadorPalavras-${{ github.ref_name }}.exe
            dist/ContadorPalavras-${{ github.ref_name }}.exe.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Contador de Palavras ${{ github.ref_name }}
          overwrite_files: true
          body: |
            ## Novidades

            - Aba Legislativo: importação de CSV com mapeamento, busca booleana,
              evidências, revisão manual, deduplicação e índice anual por Casa.
            - Aba Séries PET: mudanças anuais, excesso de curtose corrigido e
              L-curtose; entrada por CSV, digitação ou contagens dos PDFs.
            - Exportação XLSX com textos, decisões, fontes, regras e parâmetros.
            - Aba Como usar em português, com passos rápidos e interpretação
              das funcionalidades e estatísticas.
            - Pillow e setuptools atualizados para corrigir avisos da auditoria.

            ## Validação e uso

            - Testes automatizados com cobertura mínima de 80% do núcleo.
            - Executável Windows com OCR Tesseract e checksum SHA-256.
            - Desenvolvimento a partir do código requer Python 3.11 ou superior.
            - Revise a classificação temática e a completude dos dados. As
              estatísticas são descritivas e não confirmam a PET isoladamente.
          files: |
            dist/ContadorPalavras-${{ github.ref_name }}.exe
            dist/ContadorPalavras-${{ github.ref_name }}.exe.sha256
